# 태그(v*)를 push하면 테스트·린트·서명 빌드 후 GitHub 릴리스 초안(Draft)을 만든다.
# 초안을 확인하고 [Publish]해야 앱의 업데이트 확인(releases/latest)에 잡힌다.
#
# 필요한 저장소 Secrets (README "릴리스" 참고):
#   KEYSTORE_BASE64   릴리스 키스토어(.jks) 파일을 base64로 인코딩한 값
#   KEYSTORE_PASSWORD 키스토어 비밀번호
#   KEY_ALIAS         키 별칭
#   KEY_PASSWORD      키 비밀번호
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 기존 사용자가 업데이트할 수 있으려면 항상 같은 키여야 한다 (서명 인증서 SHA-256, 공개 값).
      EXPECTED_CERT_SHA256: 9d45d10c55603e4d3586c6e149a4432e6bb6a6431df378e7bdfffd5b7fa8e981
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check tag matches versionName
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 versionName $VERSION 이 다릅니다"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test, lint, build
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify "$APK"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::서명 인증서가 기존 키와 다릅니다: $CERT"
            exit 1
          fi
          cp "$APK" "YTLoader-$VERSION.apk"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "YTLoader-$VERSION.apk" \
            --draft --generate-notes --title "YTLoader $VERSION"

      - name: Remove signing key
        if: always()
        run: rm -f release.jks keystore.properties
